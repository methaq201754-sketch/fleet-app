name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  

      - name: Setup Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: 18  

      - name: Setup Java JDK  
        uses: actions/setup-java@v4  
        with:  
          distribution: 'temurin'  
          java-version: '17'  

      - name: Install dependencies  
        run: npm ci || npm install  

      - name: Expo Prebuild  
        run: npx expo prebuild --platform android --clean  

      - name: Build Android APK  
        run: |  
          cd android  
          chmod +x gradlew  
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --no-daemon  

      - name: Download Uber APK Signer
        run: |
          wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Sign APK File
        run: |
          java -jar uber-apk-signer.jar --apks android/app/build/outputs/apk/release/app-release-unsigned.apk --overwrite

      - name: Upload Signed APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: AtlasFleet-APK  
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk  
