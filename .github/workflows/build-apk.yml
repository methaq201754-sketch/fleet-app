name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع أولاً (ضروري جداً)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد Java بدون خيار التخزين المؤقت لمنع الخطأ
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Android SDK مع الحزم المستقرة
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # 4. إعطاء صلاحية التشغيل لملف gradlew
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 5. بناء تطبيق أندرويد
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. رفع ملف الـ APK الناتج كملف قابل للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
