name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  

      - name: Setup Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: 18  

      - name: Setup Java JDK  
        uses: actions/setup-java@v4  
        with:  
          distribution: 'temurin'  
          java-version: '17'  

      - name: Install dependencies  
        run: npm ci || npm install  

      - name: Expo Prebuild  
        run: npx expo prebuild --platform android --clean  

      - name: Build Android APK  
        run: |  
          cd android  
          chmod +x gradlew  
          ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" --no-daemon  

      - name: Sign APK  
        uses: rDetermined/auto-sign-apk@v1  
        with:  
          apkPath: android/app/build/outputs/apk/release/app-release-unsigned.apk  

      - name: Upload APK Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: AtlasFleet-APK  
          path: android/app/build/outputs/apk/release/app-release-unsigned-signed.apk  
