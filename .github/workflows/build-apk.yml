name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  

      - name: Setup Node.js  
        uses: actions/setup-node@v4  
        with:  
          node-version: 18  

      - name: Setup Java JDK  
        uses: actions/setup-java@v4  
        with:  
          distribution: 'temurin'  
          java-version: '17'  

      - name: Install dependencies  
        run: npm install  

      - name: Prebuild React Native App  
        run: |  
          npx expo prebuild --platform android --clean  

      - name: Build Android Release APK  
        run: |  
          cd android  
          chmod +x gradlew  
          ./gradlew assembleRelease --no-daemon  

      - name: Sign APK File  
        uses: rDetermined/auto-sign-apk@v1
        with:
          apkPath: android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Signed APK  
        uses: actions/upload-artifact@v4  
        with:  
          name: AtlasFleet-APK  
          path: android/app/build/outputs/apk/release/app-release-unsigned-signed.apk
