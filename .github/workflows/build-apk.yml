name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Check Expo project
        run: npx expo config --type public

      - name: Expo Prebuild
        env:
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle memory
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties

      - name: Build Android Debug APK
        working-directory: android
        env:
          NODE_ENV: production
          GRADLE_OPTS: "-Xmx6144m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK found:"
          ls -lh "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        run: |
          APK="${{ steps.apk.outputs.path }}"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK"

      - name: Check APK file
        run: |
          APK="${{ steps.apk.outputs.path }}"

          file "$APK"
          du -h "$APK"
          unzip -t "$APK" > /dev/null

          echo "APK ZIP structure is OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FleetManagement-1.25.2-build35
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
